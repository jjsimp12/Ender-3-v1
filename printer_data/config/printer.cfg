# Happy Hare MMU includes (should be near top of file)
[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
[include mainsail.cfg]
[include secondary_cfgs/printer_main.cfg]
[include macros/klipper_backup.cfg]
[include secondary_cfgs/shell_command.cfg]
#[include autotune_tmc.cfg]

# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
[include mmu/optional/client_macros.cfg]

# host MCU service is preinstalled and ready to use with:
[mcu CB1]
serial: /tmp/klipper_host_mcu

[temperature_sensor CB1]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[output_pin case_light]
pin: mmu_sup:MMU_EXTRUDER_HEATER
pwm: False
value: 0

[gcode_macro M355]
gcode:
  {% set S = params.S|default(1)|int %}
  #default_parameter_S=1
  SET_PIN PIN=case_light VALUE={S}