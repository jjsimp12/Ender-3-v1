# Suplimental config for use of Creality 1.1.3-1.1.5 main boards and sensor boards

[mcu mmu_sup]
#serial: /dev/serial/by-id/XXX	# Change to `canbus_uuid: 1234567890` for CANbus setups
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
restart_method: command

[board_pins mmu_sup]
mcu: mmu_sup # Assumes using an external / extra mcu dedicated to MMU
aliases:
    MMU_PRE_GATE_0=PA3,
    MMU_PRE_GATE_1=PD2,
    MMU_PRE_GATE_2=PD3,
    MMU_PRE_GATE_3=PA4,

    MMU_POST_GEAR_0=PC1,
    MMU_POST_GEAR_1=PA1,
    MMU_POST_GEAR_2=PC0,
    MMU_POST_GEAR_3=PA2,

    MMU_ESPOOLER_RWD_0={espooler_rwd_0_pin},
    MMU_ESPOOLER_FWD_0={espooler_fwd_0_pin},
    MMU_ESPOOLER_EN_0={espooler_en_0_pin},
    MMU_ESPOOLER_TRIG_0=,
    MMU_ESPOOLER_RWD_1={espooler_rwd_1_pin},
    MMU_ESPOOLER_FWD_1={espooler_fwd_1_pin},
    MMU_ESPOOLER_EN_1={espooler_en_1_pin},
    MMU_ESPOOLER_TRIG_1=,
    MMU_ESPOOLER_RWD_2={espooler_rwd_2_pin},
    MMU_ESPOOLER_FWD_2={espooler_fwd_2_pin},
    MMU_ESPOOLER_EN_2={espooler_en_2_pin},
    MMU_ESPOOLER_TRIG_2=,
    MMU_ESPOOLER_RWD_3={espooler_rwd_3_pin},
    MMU_ESPOOLER_FWD_3={espooler_fwd_3_pin},
    MMU_ESPOOLER_EN_3={espooler_en_3_pin},
    MMU_ESPOOLER_TRIG_3=,

    MMU_ENCLOSURE_HEATER=PD5,
    MMU_EXTRUDER_TEMP=PA7,
    MMU_BED_HEATER=PD5,
    MMU_BED_TEMP=PA6,

    MMU_FAN=PB4
    
##
#
#  EXP1 Connector botton view                   EXP1 as CR10 STOCKDISPLAY
#            ------                                       ------
#   GND     | 9 10 |  5V                      BEEPER_PIN | 1  2 | BTN_ENC
#   PA3   _ | 7  8 |  PC1                        BTN_EN1 | 3  4 | RESET
#   PD2  |_   5  6 |  PA1                        BTN_EN2   5  6 | LCD_PINS_D4     (ST9720 CLK)
#   PD3     | 3  4 |  RESET      (ST9720 CS) LCD_PINS_RS | 7  8 | LCD_PINS_ENABLE (ST9720 DAT)
#   PA4     | 1  2 |  PC0                            GND | 9 10 | 5V
#            ------                                       ------
#
#                                                                        Red wire
# |       |       |      |       |       |       |       |       |       |
# Pos	  Neg     PC1    PA3     PA1     PD2     Reset   PD3     PC0     PA4
#
# PA2 is on the pad located at the base of the capacitor. Ground it to pin 9 on the display as well.
# PC0 needs brought down to positive not negaive
##